name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      hil_source_run_id:
        description: Optional successful CI run ID for pre-merge HIL bootstrap
        required: false
        type: string
      hil_source_sha:
        description: Exact source SHA built by hil_source_run_id
        required: false
        type: string
      hil_board_profile:
        description: Board inventory/profile selector
        required: false
        default: hi3403-svp-nnn-01
        type: choice
        options: [hi3403-svp-nnn-01]
      hil_test_level:
        description: HIL inference count
        required: false
        default: smoke
        type: choice
        options: [smoke, stability]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODELZOO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MODELZOO_WORKFLOW_SHA: ${{ github.sha }}

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: "3.11"}
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check "ruff==0.15.4" "shellcheck-py==0.11.0.1" "jsonschema==4.25.1"
      - name: Validate repository and SDK lock
        run: |
          python ci/validate_repository.py
          python ci/validate_sdk_lock.py
          python ci/check_repository_policy.py
          python ci/check_license_policy.py
          python -m jsonschema -i ci/sdk-lock.json ci/sdk-lock.schema.json
      - name: Compile and lint support code
        env:
          NPU_INCLUDE_PATH: /tmp/modelzoo-cmake-check/include
          NPU_LIB_PATH: /tmp/modelzoo-cmake-check/lib
        run: |
          python ci/check_python_sources.py
          python -m unittest discover -s ci/tests -p 'test_*.py' -v
          ruff check ci
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          shellcheck --severity=error --exclude=SC1090,SC1091 "${scripts[@]}"
          cmake -S samples/built-in/classification/ResNet50 -B /tmp/modelzoo-cmake-check -DCMAKE_TOOLCHAIN_FILE="$PWD/samples/common/cmake/toolchain_aarch64_openeuler.cmake" -DCMAKE_C_COMPILER=/usr/bin/cc -DCMAKE_CXX_COMPILER=/usr/bin/c++ -DSOC_VERSION=SS928V100

  select-targets:
    name: Select affected targets
    needs: repository-validation
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false, fetch-depth: 0}
      - id: select
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            matrix=$(python3 ci/changed_targets.py --base "${{ github.event.pull_request.base.sha }}" --head "$MODELZOO_SOURCE_SHA")
          else
            matrix=$(python3 ci/changed_targets.py --representative)
          fi
          count=$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")
          printf 'matrix=%s\ncount=%s\n' "$matrix" "$count" >> "$GITHUB_OUTPUT"

  cross-build:
    name: Sample build / ${{ matrix.engine }} / ${{ matrix.id }}
    needs: select-targets
    if: >-
      needs.select-targets.outputs.count != '0' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - name: Read SDK cache key
        id: sdk
        run: |
          sha=$(python3 -c 'import json; d=json.load(open("ci/sdk-lock.json")); print(d["artifacts"]["${{ matrix.engine }}"]["archive"]["sha256"] + "-" + d["artifacts"]["toolchain"]["archive"]["sha256"])')
          printf 'key=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/modelzoo/downloads
          key: modelzoo-sdk-${{ runner.os }}-${{ runner.arch }}-${{ matrix.engine }}-${{ steps.sdk.outputs.key }}
      - name: Provision locked SDK
        id: toolchain
        run: bash ci/provision_toolchain.sh --engine "${{ matrix.engine }}" --lock ci/sdk-lock.json
      - name: Cross-compile target
        env:
          NPU_INCLUDE_PATH: ${{ steps.toolchain.outputs.npu-include-path }}
          NPU_LIB_PATH: ${{ steps.toolchain.outputs.npu-lib-path }}
        run: bash ci/build_sample.sh --sample "${{ matrix.sample }}" --build-def "${{ matrix.buildDef }}" 2>&1 | tee build.log
      - name: Verify and package HIL input boundary
        run: |
          artifact="${{ matrix.sample }}/build/out/main"
          file "$artifact" | grep -q 'ARM aarch64'
          mkdir -p "artifacts/${{ matrix.id }}/input"
          cp "$artifact" "artifacts/${{ matrix.id }}/main"
          cp build.log "artifacts/${{ matrix.id }}/build.log"
          python3 ci/build_manifest.py --engine "${{ matrix.engine }}" --soc "${{ matrix.buildDef }}" --sample "${{ matrix.sample }}" --main "artifacts/${{ matrix.id }}/main" --output "artifacts/${{ matrix.id }}/build-manifest.json"
          (cd "artifacts/${{ matrix.id }}" && sha256sum main build.log build-manifest.json > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelzoo-${{ matrix.id }}-${{ env.MODELZOO_SOURCE_SHA }}
          path: artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14

  cross-build-gate:
    name: Cross-build gate
    if: always()
    needs: [select-targets, cross-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate affected build results
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == pull_request && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            printf 'External fork: SDK build intentionally not run.\n'
          elif [[ "${{ needs.select-targets.outputs.count }}" != 0 && "${{ needs.cross-build.result }}" != success ]]; then
            printf 'Affected cross-builds did not all pass.\n' >&2
            exit 1
          else
            printf 'Affected cross-build gate passed.\n'
          fi

  model-conversion:
    name: Model conversion / SVP_NNN
    needs: [repository-validation, select-targets]
    if: >-
      needs.select-targets.outputs.count != '0' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: "3.11"}
      - name: Read SDK cache key
        id: sdk
        run: |
          sha=$(python3 -c 'import json; d=json.load(open("ci/sdk-lock.json")); print(d["artifacts"]["svp-nnn"]["archive"]["sha256"] + "-" + d["artifacts"]["toolchain"]["archive"]["sha256"])')
          printf 'key=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Restore raw SDK downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/modelzoo/downloads
          key: modelzoo-sdk-${{ runner.os }}-${{ runner.arch }}-svp-nnn-${{ steps.sdk.outputs.key }}
      - name: Generate pinned ONNX input
        run: |
          python -m pip install --disable-pip-version-check "onnx==1.17.0"
          python ci/generate_conversion_model.py --output conversion/input/model.onnx
          dd if=/dev/zero of=conversion/input/input.bin bs=192 count=1 status=none
          printf '5d89f056865052bcb89c910d2d62872e029fb273c3db03f8968a52a41593c1b5  conversion/input/input.bin\n' | sha256sum -c -
      - name: Provision locked ATC
        id: converter
        run: bash ci/provision_model_converter.sh ci/sdk-lock.json
      - name: Convert ONNX to OM
        run: |
          "${{ steps.converter.outputs.atc }}" --framework=5 --model="$PWD/conversion/input/model.onnx" --input_shape="input:1,3,4,4" --output="$PWD/conversion/model" --image_list="$PWD/conversion/input/input.bin" --compile_mode=1 --soc_version=SS928V100 2>&1 | tee conversion/atc.log
          test -s conversion/model.om
      - name: Package traceable pre-HIL input
        env:
          ATC: ${{ steps.converter.outputs.atc }}
        run: |
          mkdir -p conversion/hil-input/input
          cp conversion/model.om conversion/hil-input/model.om
          cp conversion/input/model.onnx conversion/hil-input/input/model.onnx
          cp conversion/input/input.bin conversion/hil-input/input/input.bin
          cp conversion/atc.log conversion/hil-input/atc.log
          printf '{"status":"not-run","reason":"HIL is outside this workflow"}\n' > conversion/hil-input/expected.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('conversion/hil-input')
          lock=json.loads(pathlib.Path('ci/sdk-lock.json').read_text())
          files=[root/'model.om',root/'input/model.onnx',root/'input/input.bin',root/'atc.log',root/'expected.json']
          atc_version=subprocess.run([os.environ['ATC'],'--version'],text=True,capture_output=True).stdout.strip()
          data={'schemaVersion':1,'commit':os.environ['MODELZOO_SOURCE_SHA'],'workflowCommit':os.environ['MODELZOO_WORKFLOW_SHA'],'sdkReleaseTag':lock['releaseTag'],'sdkArtifacts':{'svp-nnn':lock['artifacts']['svp-nnn']['archive']['sha256']},'engine':'svp-nnn','soc':'SS928V100','converter':{'executable':os.environ['ATC'],'version':atc_version},'conversion':{'framework':5,'inputShape':'input:1,3,4,4','compileMode':1,'socVersion':'SS928V100','onnxSha256':'153e867604c1c2a0c441d3a2591474e6238052b034716d105e08ce578b4b2f48','inputSha256':'5d89f056865052bcb89c910d2d62872e029fb273c3db03f8968a52a41593c1b5'},'outputs':[{'name':str(f.relative_to(root)),'size':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in files]}
          (root/'conversion-manifest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          (cd conversion/hil-input && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelzoo-conversion-hil-input-${{ env.MODELZOO_SOURCE_SHA }}
          path: conversion/hil-input/
          if-no-files-found: error
          retention-days: 14

  hil-input-package:
    name: Assemble pre-HIL input package
    needs: [select-targets, cross-build, model-conversion]
    if: >-
      needs.select-targets.outputs.count != '0' &&
      needs.cross-build.result == 'success' &&
      needs.model-conversion.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: modelzoo-built-in-classification-resnet50-ss928v100-${{ env.MODELZOO_SOURCE_SHA }}
          path: downloaded/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: modelzoo-conversion-hil-input-${{ env.MODELZOO_SOURCE_SHA }}
          path: downloaded/conversion
      - name: Assemble and verify boundary package
        run: python3 ci/package_hil_input.py --build downloaded/build --conversion downloaded/conversion --output artifacts/hil-input
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelzoo-hil-input-resnet50-svp-nnn-${{ env.MODELZOO_SOURCE_SHA }}
          path: artifacts/hil-input/
          if-no-files-found: error
          retention-days: 14

  pre-hil-gate:
    name: Pre-HIL artifact gate
    if: always()
    needs: [select-targets, model-conversion, hil-input-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate conversion and packaging
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == pull_request && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            printf 'External fork: SDK conversion and packaging intentionally not run.\n'
          elif [[ "${{ needs.select-targets.outputs.count }}" == 0 ]]; then
            printf 'No SDK-affected target: conversion and packaging intentionally not run.\n'
          elif [[ "${{ needs.model-conversion.result }}" != success || "${{ needs.hil-input-package.result }}" != success ]]; then
            printf 'Pre-HIL conversion or packaging failed.\n' >&2
            exit 1
          else
            printf 'Pre-HIL artifact gate passed.\n'
          fi

  hil-bootstrap:
    name: Pre-merge Hi3403 HIL bootstrap
    if: github.event_name == 'workflow_dispatch' && inputs.hil_source_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hil.yml
    with:
      source_run_id: ${{ inputs.hil_source_run_id }}
      source_sha: ${{ inputs.hil_source_sha }}
      board_profile: ${{ inputs.hil_board_profile }}
      test_level: ${{ inputs.hil_test_level }}
